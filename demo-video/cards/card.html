<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Countersign card</title>
<style>
  @font-face { font-family: 'Geist'; src: url('../../frontend/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Geist Mono'; src: url('../../frontend/node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Instrument Serif'; font-style: italic; src: url('../../frontend/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { zoom: 1.2; }
  html, body { width: 1600px; height: 900px; overflow: hidden; background: #0b0d14; color: #fff; font-family: 'Geist', 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .blob { position: absolute; border-radius: 9999px; filter: blur(80px); animation: drift 14s ease-in-out infinite; }
  .b1 { width: 60%; height: 70%; left: -15%; top: -25%; background: rgb(109 139 255 / .34); }
  .b2 { width: 55%; height: 65%; right: -15%; bottom: -25%; background: rgb(196 139 255 / .28); animation-delay: -5s; }
  .b3 { width: 35%; height: 45%; left: 40%; top: 45%; background: rgb(67 211 184 / .12); animation-delay: -9s; }
  @keyframes drift { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(4%, -3%) scale(1.07); } }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgb(255 255 255 / .05) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .05) 1px, transparent 1px); background-size: 48px 48px; mask-image: radial-gradient(ellipse at center, #000 25%, transparent 75%); }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .up { opacity: 0; transform: translateY(22px); filter: blur(8px); animation: up .9s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes up { to { opacity: 1; transform: none; filter: blur(0); } }
  .logo { width: 84px; height: 84px; border-radius: 22px; background: linear-gradient(135deg, #2849d6, #8a3fd1); display: grid; place-items: center; box-shadow: 0 20px 60px -10px rgb(109 139 255 / .6); }
  .kicker { font-size: 18px; letter-spacing: .22em; text-transform: uppercase; color: #aab4ff; font-weight: 600; }
  .title { font-size: 120px; font-weight: 650; letter-spacing: -.04em; line-height: 1; }
  .serif { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; background: linear-gradient(120deg, #9fb0ff, #c3a8ff, #f0a6d0); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { font-size: 34px; color: #d5d9e3; letter-spacing: -.01em; }
  .line { height: 2px; width: 0; background: linear-gradient(90deg, transparent, #9fb0ff, #c48bff, transparent); animation: grow 1.2s .5s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes grow { to { width: 520px; } }
  .index { font-family: 'Geist Mono', monospace; font-size: 22px; color: #9fb0ff; letter-spacing: .3em; }
  .chapter { font-size: 76px; font-weight: 640; letter-spacing: -.035em; }
  .foot { position: absolute; bottom: 150px; left: 0; right: 0; text-align: center; font-size: 15px; color: #8d95a8; }
  /* architecture */
  .arch { position: absolute; inset: 56px 90px 150px; display: grid; grid-template-rows: auto 1fr auto; gap: 28px; }
  .arch h1 { font-size: 46px; font-weight: 640; letter-spacing: -.03em; }
  .flow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; align-items: stretch; align-content: center; }
  .node { position: relative; border-radius: 18px; border: 1px solid rgb(255 255 255 / .12); background: rgb(255 255 255 / .05); padding: 22px 20px; }
  .node .n { font-family: 'Geist Mono', monospace; font-size: 13px; color: #9fb0ff; letter-spacing: .18em; }
  .node h3 { margin-top: 8px; font-size: 24px; font-weight: 620; letter-spacing: -.02em; }
  .node p { margin-top: 10px; font-size: 17px; line-height: 1.55; color: #c9cdd8; }
  .node { min-height: 230px; }
  .node::after { content: ''; position: absolute; right: -14px; top: 50%; width: 10px; height: 10px; border-top: 2px solid #8ea2ff; border-right: 2px solid #8ea2ff; transform: translateY(-50%) rotate(45deg); }
  .node:last-child::after { display: none; }
  .stack { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .chip { border-radius: 999px; border: 1px solid rgb(255 255 255 / .14); background: rgb(255 255 255 / .06); padding: 9px 16px; font-size: 15.5px; color: #e4e7ee; }
  .chip b { color: #9fb0ff; font-weight: 600; }
</style>
</head>
<body>
<div class="stage">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="grid"></div>
  <div id="root"></div>
</div>
<script>
  const q = new URLSearchParams(location.search)
  const type = q.get('type')
  const esc = (s) => (s || '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
  const logo = '<div class="logo up"><svg width="46" height="46" viewBox="0 0 32 32"><path d="M9 17.5l4.2 4.2L23 11.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 25h16" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".5"/></svg></div>'
  const root = document.getElementById('root')
  if (type === 'title' || type === 'closing') {
    root.innerHTML = `<div class="center">
      ${logo}
      <div class="kicker up" style="margin-top:34px;animation-delay:.25s">${esc(q.get('kicker'))}</div>
      <div class="title up" style="margin-top:18px;animation-delay:.4s">${esc(q.get('title'))}</div>
      <div class="line" style="margin-top:34px"></div>
      <div class="sub up" style="margin-top:30px;animation-delay:.75s">The model drafts. The rules verify. <span class="serif" style="font-size:42px">A manager countersigns.</span></div>
    </div>
    <div class="foot up" style="animation-delay:1.2s">${type === 'closing' ? 'Open-weight model &middot; Ten deterministic gates &middot; Human countersignature &middot; github.com/sampv69git/Dayforce' : 'Dayforce AI Innovation Challenge &middot; All people and data are synthetic'}</div>`
  } else if (type === 'chapter') {
    root.innerHTML = `<div class="center">
      <div class="index up">${esc(q.get('index'))}</div>
      <div class="chapter up" style="margin-top:18px;animation-delay:.15s">${esc(q.get('title'))}</div>
      <div class="line" style="margin-top:30px;animation-delay:.3s"></div>
    </div>`
  } else if (type === 'architecture') {
    const nodes = [
      ['01', 'Rules detect', '18 deterministic rules in a pure Python engine: pairing, pay, cascades, forecast.'],
      ['02', 'Policy retrieval', 'Metadata filters, BM25 and bge-small embeddings, fused by reciprocal rank fusion.'],
      ['03', 'Model drafts', 'gpt-oss-20b with strict JSON schema; qwen3:4b offline; rule-based fallback.'],
      ['04', 'Harness verifies', 'Ten gates, one guided repair, visible fallback or escalation.'],
      ['05', 'People countersign', 'Approve, edit, or reject; append-only revisions; hash-chained audit.'],
    ]
    const chips = [['API', 'FastAPI + Pydantic v2'], ['Data', 'PostgreSQL 16 + pgvector'], ['Web', 'React 19 + TypeScript'], ['Contract', 'OpenAPI 3.1'], ['Auth', 'scrypt + revocable JWT'], ['Agents', 'Read-only MCP server'], ['Quality', '190+ automated tests'], ['Run', 'docker compose up']]
    root.innerHTML = `<div class="arch">
      <h1 class="up">How Countersign works</h1>
      <div class="flow">${nodes.map((n, i) => `<div class="node up" style="animation-delay:${0.25 + i * 0.18}s"><div class="n">${n[0]}</div><h3>${n[1]}</h3><p>${n[2]}</p></div>`).join('')}</div>
      <div class="stack">${chips.map((c, i) => `<span class="chip up" style="animation-delay:${1.3 + i * 0.08}s"><b>${c[0]}</b> ${c[1]}</span>`).join('')}</div>
    </div>`
  }
</script>
</body>
</html>
