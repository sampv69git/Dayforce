name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDER: rule_based
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: backend/.fastembed_cache
          key: fastembed-bge-small-en-v1.5
      - name: Lint
        run: uv run ruff check app tests eval && uv run ruff format --check app tests eval
      - name: Type check
        run: uv run mypy
      - name: Tests (unit, integration, API contract with Schemathesis and OpenAPI drift)
        run: uv run pytest -q --cov=app/engine --cov=app/harness --cov-report=term-missing:skip-covered --cov-fail-under=85

  evaluation:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDER: rule_based
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: backend/.fastembed_cache
          key: fastembed-bge-small-en-v1.5
      - name: Deterministic evaluation with quality gates
        run: uv run python -m eval.run --providers scripted,rule_based --gate
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        run: |
          if git grep -nE '(gsk_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{32,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----)' -- . ':!*.lock' ':!package-lock.json'; then
            echo "Possible secret found"; exit 1
          fi
