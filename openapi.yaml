openapi: 3.1.0
info:
  title: Countersign API
  version: 0.1.0-draft
  description: |
    Design-target contract for Countersign, a governed timecard exception resolution agent.
    This draft precedes implementation. After step 6 the file is regenerated from the FastAPI
    application and CI fails on drift. All data served by this API is synthetic.
servers:
  - url: http://localhost:8000/api/v1
security:
  - bearerAuth: []
tags:
  - name: system
  - name: auth
  - name: exceptions
  - name: drafts
  - name: timecards
  - name: forecast
  - name: policies
  - name: traces
  - name: audit
  - name: outcomes
  - name: employee
  - name: admin

paths:
  /health:
    get:
      tags: [system]
      security: []
      summary: Liveness
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /health/ready:
    get:
      tags: [system]
      security: []
      summary: Readiness (database, embeddings, LLM provider)
      responses:
        '200': { description: Ready, content: { application/json: { schema: { $ref: '#/components/schemas/Readiness' } } } }
        '503': { $ref: '#/components/responses/Problem' }

  /auth/demo-login:
    post:
      tags: [auth]
      security: []
      summary: Demo sign-in as a seeded persona
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DemoLoginRequest' } } }
      responses:
        '200': { description: Token, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /auth/personas:
    get:
      tags: [auth]
      security: []
      summary: List demo personas
      responses:
        '200': { description: Personas, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Persona' } } } } }
  /me:
    get:
      tags: [auth]
      summary: Current user
      responses:
        '200': { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Problem' }

  /pay-period/current:
    get:
      tags: [exceptions]
      summary: Current pay period, simulated clock, cutoff, and progress
      parameters: [ { $ref: '#/components/parameters/SiteQuery' } ]
      responses:
        '200': { description: Pay period, content: { application/json: { schema: { $ref: '#/components/schemas/PayPeriod' } } } }

  /exceptions:
    get:
      tags: [exceptions]
      summary: Exception queue (scoped by role and site), grouped by root cause and ranked by risk
      parameters:
        - $ref: '#/components/parameters/SiteQuery'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ExceptionStatus' } }
        - { name: family, in: query, schema: { $ref: '#/components/schemas/RuleFamily' } }
        - { name: severity, in: query, schema: { $ref: '#/components/schemas/Severity' } }
        - { name: employee_id, in: query, schema: { type: string } }
        - { name: route, in: query, schema: { $ref: '#/components/schemas/Route' } }
      responses:
        '200': { description: Queue, content: { application/json: { schema: { $ref: '#/components/schemas/ExceptionQueue' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /exceptions/{exception_id}:
    get:
      tags: [exceptions]
      summary: Exception detail with context, evidence, timeline data, cascade, latest draft
      parameters: [ { $ref: '#/components/parameters/ExceptionId' } ]
      responses:
        '200': { description: Detail, content: { application/json: { schema: { $ref: '#/components/schemas/ExceptionDetail' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /exceptions/{exception_id}/drafts:
    post:
      tags: [drafts]
      summary: Run the harness pipeline to draft a resolution
      parameters: [ { $ref: '#/components/parameters/ExceptionId' } ]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/DraftRequest' } } }
      responses:
        '201': { description: Draft created, content: { application/json: { schema: { $ref: '#/components/schemas/Draft' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /exceptions/{exception_id}/attestation-requests:
    post:
      tags: [exceptions]
      summary: Ask the employee to confirm a time (simulated notification)
      parameters: [ { $ref: '#/components/parameters/ExceptionId' } ]
      responses:
        '202': { description: Requested }
        '403': { $ref: '#/components/responses/Problem' }

  /drafts/{draft_id}:
    get:
      tags: [drafts]
      summary: Get a draft (pipeline run view model)
      parameters: [ { $ref: '#/components/parameters/DraftId' } ]
      responses:
        '200': { description: Draft, content: { application/json: { schema: { $ref: '#/components/schemas/Draft' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /drafts/{draft_id}/validate-edit:
    post:
      tags: [drafts]
      summary: Validate edited operations through gates G6 to G9 without saving
      parameters: [ { $ref: '#/components/parameters/DraftId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EditValidationRequest' } } }
      responses:
        '200': { description: Validation, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationReport' } } } }
  /drafts/{draft_id}/decision:
    post:
      tags: [drafts]
      summary: Approve, edit, or reject a draft
      parameters: [ { $ref: '#/components/parameters/DraftId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DecisionRequest' } } }
      responses:
        '200': { description: Decision applied, content: { application/json: { schema: { $ref: '#/components/schemas/DecisionResult' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /drafts/bulk-approve:
    post:
      tags: [drafts]
      summary: Approve several eligible drafts (each audited individually)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BulkApproveRequest' } } }
      responses:
        '200': { description: Results, content: { application/json: { schema: { $ref: '#/components/schemas/BulkApproveResult' } } } }

  /timecards/{employee_id}:
    get:
      tags: [timecards]
      summary: Weekly timecard with shifts, punches, revisions, totals, and pay
      parameters:
        - { name: employee_id, in: path, required: true, schema: { type: string } }
        - { name: week_start, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Timecard, content: { application/json: { schema: { $ref: '#/components/schemas/Timecard' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /simulate:
    post:
      tags: [timecards]
      summary: What-if simulation of operations (exceptions and pay before and after)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SimulateRequest' } } }
      responses:
        '200': { description: Simulation, content: { application/json: { schema: { $ref: '#/components/schemas/SimulationResult' } } } }

  /forecast/overtime:
    get:
      tags: [forecast]
      summary: Projected weekly hours, overtime risks, and swap candidates
      parameters: [ { $ref: '#/components/parameters/SiteQuery' } ]
      responses:
        '200': { description: Forecast, content: { application/json: { schema: { $ref: '#/components/schemas/OvertimeForecast' } } } }

  /policies:
    get:
      tags: [policies]
      summary: Policy versions, documents, and clauses
      responses:
        '200': { description: Policy pack, content: { application/json: { schema: { $ref: '#/components/schemas/PolicyPack' } } } }
  /policies/search:
    post:
      tags: [policies]
      summary: Retrieval playground (same code path as the pipeline)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PolicySearchRequest' } } }
      responses:
        '200': { description: Results, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RetrievedClause' } } } } }

  /traces:
    get:
      tags: [traces]
      summary: Recent pipeline runs
      parameters:
        - { name: route, in: query, schema: { $ref: '#/components/schemas/Route' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: Runs, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RunSummary' } } } } }
  /traces/{run_id}:
    get:
      tags: [traces]
      summary: Full trace for a pipeline run
      parameters: [ { name: run_id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Trace, content: { application/json: { schema: { $ref: '#/components/schemas/Trace' } } } }

  /audit:
    get:
      tags: [audit]
      summary: Audit events (admin)
      parameters:
        - { name: entity_id, in: query, schema: { type: string } }
        - { name: after_seq, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200': { description: Events, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /audit/verify:
    get:
      tags: [audit]
      summary: Verify the audit hash chain (admin)
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/AuditVerification' } } } }

  /outcomes:
    get:
      tags: [outcomes]
      summary: Outcome and harness metrics computed from stored data
      parameters: [ { $ref: '#/components/parameters/SiteQuery' } ]
      responses:
        '200': { description: Metrics, content: { application/json: { schema: { $ref: '#/components/schemas/Outcomes' } } } }
  /evaluation/latest:
    get:
      tags: [outcomes]
      summary: Latest committed evaluation report
      responses:
        '200': { description: Report, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationReport' } } } }
        '404': { $ref: '#/components/responses/Problem' }

  /me/actions:
    get:
      tags: [employee]
      summary: Employee action items (attestation requests) and week summary
      responses:
        '200': { description: Actions, content: { application/json: { schema: { $ref: '#/components/schemas/EmployeeHome' } } } }
  /attestations:
    post:
      tags: [employee]
      summary: Employee confirms a time and adds an optional note (untrusted)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AttestationRequest' } } }
      responses:
        '201': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/Attestation' } } } }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/detect:
    post:
      tags: [admin]
      summary: Re-run detection (idempotent)
      responses:
        '200': { description: Summary, content: { application/json: { schema: { $ref: '#/components/schemas/DetectionSummary' } } } }
  /admin/reset:
    post:
      tags: [admin]
      summary: Reset and reseed demo data
      responses:
        '202': { description: Reset started }
  /admin/provider:
    get:
      tags: [admin]
      summary: Current LLM provider status
      responses:
        '200': { description: Status, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderStatus' } } } }
    put:
      tags: [admin]
      summary: Switch LLM provider (groq, ollama, rule_based)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProviderSwitch' } } }
      responses:
        '200': { description: Status, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderStatus' } } } }
  /admin/replay:
    post:
      tags: [admin]
      summary: Replay a pipeline run with an injected fault
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReplayRequest' } } }
      responses:
        '201': { description: New run, content: { application/json: { schema: { $ref: '#/components/schemas/Draft' } } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    SiteQuery: { name: site, in: query, schema: { type: string, enum: [FRE, AUS, BLR] } }
    ExceptionId: { name: exception_id, in: path, required: true, schema: { type: string } }
    DraftId: { name: draft_id, in: path, required: true, schema: { type: string } }
  responses:
    Problem:
      description: Error (RFC 9457)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }
    Health: { type: object, required: [status], properties: { status: { type: string, enum: [ok] } } }
    Readiness:
      type: object
      required: [database, embeddings, provider]
      properties:
        database: { type: string, enum: [ok, error] }
        embeddings: { type: string, enum: [ok, error] }
        provider: { $ref: '#/components/schemas/ProviderStatus' }
    Role: { type: string, enum: [employee, manager, payroll_admin] }
    Severity: { type: string, enum: [critical, high, medium, low] }
    RuleFamily: { type: string, enum: [punch_integrity, schedule, meal_rest, overtime, policy, forecast] }
    ExceptionStatus: { type: string, enum: [open, suggested, awaiting_employee, escalated, resolved, superseded] }
    Route: { type: string, enum: [suggest, fallback, escalate, manual] }
    Persona:
      type: object
      required: [user_id, display_name, role, title]
      properties:
        user_id: { type: string }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        title: { type: string }
        site: { type: [string, 'null'] }
        summary: { type: string }
    DemoLoginRequest: { type: object, required: [user_id], additionalProperties: false, properties: { user_id: { type: string, maxLength: 40 } } }
    TokenResponse: { type: object, required: [access_token, token_type, user], properties: { access_token: { type: string }, token_type: { type: string, enum: [bearer] }, user: { $ref: '#/components/schemas/User' } } }
    User:
      type: object
      required: [user_id, display_name, role]
      properties:
        user_id: { type: string }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        site_scope: { type: array, items: { type: string } }
        employee_id: { type: [string, 'null'] }
    PayPeriod:
      type: object
      required: [week_start, week_end, now, cutoff_at, total, resolved, ready_to_countersign]
      properties:
        week_start: { type: string, format: date }
        week_end: { type: string, format: date }
        now: { type: string, format: date-time, description: Simulated clock }
        cutoff_at: { type: string, format: date-time }
        total: { type: integer }
        resolved: { type: integer }
        ready_to_countersign: { type: integer }
    EvidenceItem:
      type: object
      required: [id, kind, at, strength, simulated]
      properties:
        id: { type: string }
        kind: { type: string, enum: [badge_entry, badge_exit, scanner_activity, scheduled_start, scheduled_end, attestation, punch] }
        at: { type: string, description: Site-local time YYYY-MM-DDTHH:MM }
        source: { type: [string, 'null'] }
        strength: { type: string, enum: [strong, medium, weak] }
        simulated: { type: boolean }
    ExceptionSummary:
      type: object
      required: [id, rule_id, title, family, severity, employee_id, employee_name, work_date, status, risk_score]
      properties:
        id: { type: string }
        rule_id: { type: string }
        title: { type: string }
        evidence_summary: { type: string }
        family: { $ref: '#/components/schemas/RuleFamily' }
        severity: { $ref: '#/components/schemas/Severity' }
        employee_id: { type: string }
        employee_name: { type: string }
        work_date: { type: string, format: date }
        status: { $ref: '#/components/schemas/ExceptionStatus' }
        route: { oneOf: [ { $ref: '#/components/schemas/Route' }, { type: 'null' } ] }
        evidence_strength: { type: [string, 'null'], enum: [high, medium, low, null] }
        pay_impact: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: 'null' } ] }
        risk_score: { type: number }
        root_id: { type: [string, 'null'] }
        symptom_ids: { type: array, items: { type: string } }
        bulk_eligible: { type: boolean }
        has_untrusted_note: { type: boolean }
    ExceptionQueue:
      type: object
      required: [items, counts]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ExceptionSummary' } }
        counts: { type: object, additionalProperties: { type: integer } }
    ExceptionDetail:
      allOf:
        - $ref: '#/components/schemas/ExceptionSummary'
        - type: object
          required: [employee, evidence, timeline, allowed_ops]
          properties:
            employee: { $ref: '#/components/schemas/EmployeeRef' }
            evidence: { type: array, items: { $ref: '#/components/schemas/EvidenceItem' } }
            untrusted_note: { oneOf: [ { $ref: '#/components/schemas/UntrustedText' }, { type: 'null' } ] }
            timeline: { $ref: '#/components/schemas/Timeline' }
            allowed_ops: { type: array, items: { $ref: '#/components/schemas/OpKind' } }
            plausible_window: { type: object, properties: { earliest: { type: string }, latest: { type: string } } }
            latest_draft: { oneOf: [ { $ref: '#/components/schemas/Draft' }, { type: 'null' } ] }
            history: { type: array, items: { $ref: '#/components/schemas/RunSummary' } }
    EmployeeRef:
      type: object
      required: [id, name, role, site, exempt, timezone]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        site: { type: string }
        exempt: { type: boolean }
        timezone: { type: string }
        hourly_rate: { $ref: '#/components/schemas/Money' }
    UntrustedText:
      type: object
      required: [text, flags]
      properties:
        text: { type: string, maxLength: 500 }
        flags: { type: array, items: { type: string } }
    Timeline:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items:
            type: object
            required: [date, schedules, punches, evidence]
            properties:
              date: { type: string, format: date }
              schedules: { type: array, items: { type: object, properties: { id: { type: string }, start: { type: string }, end: { type: string } } } }
              punches: { type: array, items: { type: object, properties: { id: { type: string }, type: { $ref: '#/components/schemas/PunchType' }, at: { type: string }, source: { type: string }, voided: { type: boolean } } } }
              evidence: { type: array, items: { $ref: '#/components/schemas/EvidenceItem' } }
    PunchType: { type: string, enum: [IN, OUT, MEAL_START, MEAL_END] }
    OpKind: { type: string, enum: [add_punch, void_punch, record_premium, approve_overtime, acknowledge, approve_unscheduled, reassign_shift, escalate] }
    Operation:
      type: object
      additionalProperties: false
      required: [op, punch_type, at, punch_id, premium_kind, hours, shift_id, to_employee_id, evidence_ids]
      properties:
        op: { $ref: '#/components/schemas/OpKind' }
        punch_type: { oneOf: [ { $ref: '#/components/schemas/PunchType' }, { type: 'null' } ] }
        at: { type: [string, 'null'] }
        punch_id: { type: [string, 'null'] }
        premium_kind: { type: [string, 'null'], enum: [meal, rest, holiday, seventh_day, null] }
        hours: { type: [number, 'null'] }
        shift_id: { type: [string, 'null'] }
        to_employee_id: { type: [string, 'null'] }
        evidence_ids: { type: array, items: { type: string } }
    Citation:
      type: object
      additionalProperties: false
      required: [clause_id, quote]
      properties:
        clause_id: { type: string }
        quote: { type: string }
    DraftResolution:
      description: Strict LLM output contract (HARNESS.md section 1.3)
      type: object
      additionalProperties: false
      required: [exception_id, summary, explanation, operations, citations, employee_note_assessment, needs_escalation, escalation_reason, self_confidence]
      properties:
        exception_id: { type: string }
        summary: { type: string }
        explanation: { type: string }
        operations: { type: array, items: { $ref: '#/components/schemas/Operation' } }
        citations: { type: array, items: { $ref: '#/components/schemas/Citation' } }
        employee_note_assessment:
          type: object
          additionalProperties: false
          required: [relevant, contains_instructions]
          properties: { relevant: { type: boolean }, contains_instructions: { type: boolean } }
        needs_escalation: { type: boolean }
        escalation_reason: { type: [string, 'null'] }
        self_confidence: { type: string, enum: [low, medium, high] }
    GateResult:
      type: object
      required: [id, name, status, detail]
      properties:
        id: { type: string, enum: [G1, G2, G3, G4, G5, G6, G7, G8, G9, G10] }
        name: { type: string }
        status: { type: string, enum: [pass, fail, skip] }
        detail: { type: string }
    ValidationReport:
      type: object
      required: [passed, attempt, gates]
      properties:
        passed: { type: boolean }
        attempt: { type: integer }
        gates: { type: array, items: { $ref: '#/components/schemas/GateResult' } }
    EvidenceStrength:
      type: object
      required: [score, level, factors]
      properties:
        score: { type: number, minimum: 0, maximum: 1 }
        level: { type: string, enum: [high, medium, low] }
        factors: { type: object, additionalProperties: { type: number } }
    Money: { type: object, required: [amount, currency], properties: { amount: { type: number }, currency: { type: string, enum: [USD, INR] } } }
    PaySnapshot:
      type: object
      required: [regular_hours, overtime_hours, double_time_hours, premium_hours, cost]
      properties:
        regular_hours: { type: number }
        overtime_hours: { type: number }
        double_time_hours: { type: number }
        premium_hours: { type: number }
        cost: { $ref: '#/components/schemas/Money' }
    Draft:
      type: object
      required: [id, exception_id, route, provider, model_id, prompt_version, attempts, validation, created_at]
      properties:
        id: { type: string }
        exception_id: { type: string }
        route: { $ref: '#/components/schemas/Route' }
        repaired: { type: boolean }
        provider: { type: string, enum: [groq, ollama, rule_based, scripted] }
        model_id: { type: string }
        prompt_version: { type: string }
        attempts: { type: integer }
        resolution: { oneOf: [ { $ref: '#/components/schemas/DraftResolution' }, { type: 'null' } ] }
        fallback_reason: { type: [string, 'null'] }
        escalation_reason: { type: [string, 'null'] }
        validation: { $ref: '#/components/schemas/ValidationReport' }
        evidence_strength: { $ref: '#/components/schemas/EvidenceStrength' }
        retrieved: { type: array, items: { $ref: '#/components/schemas/RetrievedClause' } }
        pay_before: { $ref: '#/components/schemas/PaySnapshot' }
        pay_after: { $ref: '#/components/schemas/PaySnapshot' }
        clears: { type: array, items: { type: string } }
        introduces: { type: array, items: { type: string } }
        latency_ms: { type: integer }
        trace_id: { type: string }
        decision: { oneOf: [ { $ref: '#/components/schemas/Decision' }, { type: 'null' } ] }
        created_at: { type: string, format: date-time }
    DraftRequest:
      type: object
      additionalProperties: false
      properties:
        force: { type: boolean, default: false, description: Re-draft even if a cached draft exists }
    EditValidationRequest:
      type: object
      additionalProperties: false
      required: [operations]
      properties: { operations: { type: array, items: { $ref: '#/components/schemas/Operation' } } }
    DecisionRequest:
      type: object
      additionalProperties: false
      required: [action, reason_code]
      properties:
        action: { type: string, enum: [approve, edit, reject] }
        reason_code: { type: string, enum: [AGREE, TIME_ADJUSTED, EVIDENCE_PREFERRED, EMPLOYEE_CONFIRMED, INCORRECT_TIME, WRONG_ACTION, POLICY_MISAPPLIED, NEEDS_INVESTIGATION, OTHER] }
        note: { type: [string, 'null'], maxLength: 500 }
        operations: { type: [array, 'null'], items: { $ref: '#/components/schemas/Operation' } }
    Decision:
      type: object
      required: [id, action, reason_code, actor_id, decided_at]
      properties:
        id: { type: string }
        action: { type: string }
        reason_code: { type: string }
        note: { type: [string, 'null'] }
        actor_id: { type: string }
        actor_name: { type: string }
        decided_at: { type: string, format: date-time }
    DecisionResult:
      type: object
      required: [decision, resolved_exception_ids, revision_ids]
      properties:
        decision: { $ref: '#/components/schemas/Decision' }
        resolved_exception_ids: { type: array, items: { type: string } }
        new_exception_ids: { type: array, items: { type: string } }
        revision_ids: { type: array, items: { type: string } }
        pay_after: { $ref: '#/components/schemas/PaySnapshot' }
    BulkApproveRequest:
      type: object
      additionalProperties: false
      required: [draft_ids]
      properties: { draft_ids: { type: array, items: { type: string }, maxItems: 50 } }
    BulkApproveResult:
      type: object
      required: [approved, skipped]
      properties:
        approved: { type: array, items: { type: string } }
        skipped: { type: array, items: { type: object, properties: { draft_id: { type: string }, reason: { type: string } } } }
    Timecard:
      type: object
      required: [employee, week_start, timeline, pay, exceptions]
      properties:
        employee: { $ref: '#/components/schemas/EmployeeRef' }
        week_start: { type: string, format: date }
        timeline: { $ref: '#/components/schemas/Timeline' }
        pay: { $ref: '#/components/schemas/PaySnapshot' }
        exceptions: { type: array, items: { $ref: '#/components/schemas/ExceptionSummary' } }
        revisions: { type: array, items: { type: object } }
    SimulateRequest:
      type: object
      additionalProperties: false
      required: [employee_id, operations]
      properties:
        employee_id: { type: string }
        operations: { type: array, items: { $ref: '#/components/schemas/Operation' } }
    SimulationResult:
      type: object
      required: [exceptions_before, exceptions_after, pay_before, pay_after]
      properties:
        exceptions_before: { type: array, items: { type: string } }
        exceptions_after: { type: array, items: { type: string } }
        pay_before: { $ref: '#/components/schemas/PaySnapshot' }
        pay_after: { $ref: '#/components/schemas/PaySnapshot' }
    OvertimeForecast:
      type: object
      required: [week_start, rows, risks]
      properties:
        week_start: { type: string, format: date }
        rows: { type: array, items: { type: object, properties: { employee: { $ref: '#/components/schemas/EmployeeRef' }, days: { type: array, items: { type: object } }, worked_hours: { type: number }, scheduled_hours: { type: number }, projected_hours: { type: number }, threshold_hours: { type: number } } } }
        risks:
          type: array
          items:
            type: object
            properties:
              exception_id: { type: string }
              employee_id: { type: string }
              projected_overtime_hours: { type: number }
              projected_cost: { $ref: '#/components/schemas/Money' }
              shift_id: { type: string }
              candidates: { type: array, items: { $ref: '#/components/schemas/SwapCandidate' } }
    SwapCandidate:
      type: object
      required: [employee_id, name, eligible, checks]
      properties:
        employee_id: { type: string }
        name: { type: string }
        eligible: { type: boolean }
        projected_hours_after: { type: number }
        rest_before_hours: { type: number }
        rest_after_hours: { type: number }
        checks: { type: object, additionalProperties: { type: boolean } }
        reason: { type: [string, 'null'] }
    PolicyClause:
      type: object
      required: [clause_id, document, title, text, jurisdictions, effective_from]
      properties:
        clause_id: { type: string }
        document: { type: string }
        title: { type: string }
        text: { type: string }
        jurisdictions: { type: array, items: { type: string } }
        employee_classes: { type: array, items: { type: string } }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date }
        precedence: { type: string, enum: [base, override] }
    PolicyPack:
      type: object
      required: [version, documents, clauses]
      properties:
        version: { type: string }
        documents: { type: array, items: { type: object, properties: { id: { type: string }, title: { type: string } } } }
        clauses: { type: array, items: { $ref: '#/components/schemas/PolicyClause' } }
    PolicySearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, maxLength: 300 }
        jurisdiction: { type: [string, 'null'] }
        employee_class: { type: [string, 'null'], enum: [exempt, non_exempt, null] }
        on_date: { type: [string, 'null'], format: date }
        rule_id: { type: [string, 'null'] }
    RetrievedClause:
      type: object
      required: [clause_id, title, fused_score]
      properties:
        clause_id: { type: string }
        title: { type: string }
        text: { type: string }
        bm25_rank: { type: [integer, 'null'] }
        dense_rank: { type: [integer, 'null'] }
        fused_score: { type: number }
        required: { type: boolean }
        precedence: { type: string }
    Span:
      type: object
      required: [span_id, name, start, end, status]
      properties:
        span_id: { type: string }
        parent_id: { type: [string, 'null'] }
        name: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        status: { type: string, enum: [ok, error] }
        attributes: { type: object }
    RunSummary:
      type: object
      required: [run_id, exception_id, route, provider, model_id, latency_ms, created_at]
      properties:
        run_id: { type: string }
        exception_id: { type: string }
        route: { $ref: '#/components/schemas/Route' }
        failed_gates: { type: array, items: { type: string } }
        provider: { type: string }
        model_id: { type: string }
        fault: { type: [string, 'null'] }
        latency_ms: { type: integer }
        created_at: { type: string, format: date-time }
    Trace:
      type: object
      required: [run, spans]
      properties:
        run: { $ref: '#/components/schemas/RunSummary' }
        spans: { type: array, items: { $ref: '#/components/schemas/Span' } }
        prompt: { type: object, properties: { version: { type: string }, hash: { type: string }, system: { type: string }, user: { type: string } } }
        raw_outputs: { type: array, items: { type: string } }
        validations: { type: array, items: { $ref: '#/components/schemas/ValidationReport' } }
    AuditEvent:
      type: object
      required: [seq, occurred_at, actor_id, event_type, entity_type, entity_id, hash, prev_hash]
      properties:
        seq: { type: integer }
        occurred_at: { type: string, format: date-time }
        actor_id: { type: string }
        actor_role: { type: string }
        event_type: { type: string }
        entity_type: { type: string }
        entity_id: { type: string }
        payload: { type: object }
        prev_hash: { type: string }
        hash: { type: string }
    AuditVerification:
      type: object
      required: [intact, events_checked]
      properties:
        intact: { type: boolean }
        events_checked: { type: integer }
        first_broken_seq: { type: [integer, 'null'] }
    Outcomes:
      type: object
      required: [source_label]
      properties:
        source_label: { type: string, description: e.g. "Measured in this environment from synthetic data" }
        resolved_before_cutoff_pct: { type: number }
        open: { type: integer }
        median_time_to_decision_s: { type: [number, 'null'] }
        cleared_by_cascade: { type: integer }
        paid_hours_recovered: { type: number }
        paid_value_recovered: { type: array, items: { $ref: '#/components/schemas/Money' } }
        overtime_cost_flagged: { type: array, items: { $ref: '#/components/schemas/Money' } }
        overtime_cost_avoided: { type: array, items: { $ref: '#/components/schemas/Money' } }
        premiums_surfaced_hours: { type: number }
        harness: { type: object, additionalProperties: true }
    EvaluationReport:
      type: object
      required: [run_at, commit, provider, model_id, dataset_size, metrics]
      properties:
        run_at: { type: string, format: date-time }
        commit: { type: string }
        provider: { type: string }
        model_id: { type: string }
        dataset_size: { type: integer }
        metrics: { type: object, additionalProperties: true }
    EmployeeHome:
      type: object
      required: [employee, actions, week]
      properties:
        employee: { $ref: '#/components/schemas/EmployeeRef' }
        actions: { type: array, items: { type: object, properties: { exception_id: { type: string }, title: { type: string }, suggested_time: { type: [string, 'null'] }, evidence: { type: array, items: { $ref: '#/components/schemas/EvidenceItem' } }, status: { type: string } } } }
        week: { type: object }
    AttestationRequest:
      type: object
      additionalProperties: false
      required: [exception_id, confirmed_at]
      properties:
        exception_id: { type: string }
        confirmed_at: { type: string, description: Site-local time YYYY-MM-DDTHH:MM }
        note: { type: [string, 'null'], maxLength: 500 }
    Attestation:
      type: object
      required: [id, exception_id, confirmed_at, flags]
      properties:
        id: { type: string }
        exception_id: { type: string }
        confirmed_at: { type: string }
        note: { type: [string, 'null'] }
        flags: { type: array, items: { type: string } }
    DetectionSummary:
      type: object
      required: [created, unchanged, superseded]
      properties: { created: { type: integer }, unchanged: { type: integer }, superseded: { type: integer } }
    ProviderStatus:
      type: object
      required: [provider, model_id, available]
      properties:
        provider: { type: string, enum: [groq, ollama, rule_based, scripted] }
        model_id: { type: string }
        available: { type: boolean }
        detail: { type: [string, 'null'] }
    ProviderSwitch:
      type: object
      additionalProperties: false
      required: [provider]
      properties: { provider: { type: string, enum: [groq, ollama, rule_based] } }
    ReplayRequest:
      type: object
      additionalProperties: false
      required: [run_id, fault]
      properties:
        run_id: { type: string }
        fault: { type: string, enum: [malformed_json, hallucinated_clause, unretrieved_clause, fabricated_quote, disallowed_action, unanchored_time, does_not_fix, reduces_paid_hours, wrong_numbers, injection_echo, timeout, bad_then_good] }
